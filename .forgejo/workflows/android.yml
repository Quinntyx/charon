name: Android checks
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  android:
    name: Unit tests, lint, and APK
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/android-sdk:36
    steps:
      - name: Checkout exact commit without Node
        run: |
          git init .
          git remote add origin '${{ github.server_url }}/${{ github.repository }}.git'
          git fetch --depth 1 origin '${{ github.sha }}'
          git checkout --detach FETCH_HEAD
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify test discovery and APK output
        run: |
          test -f app/build/test-results/testDebugUnitTest/TEST-dev.quinntyx.charon.BootstrapTest.xml
          test -f app/build/reports/lint-results-debug.html
          test -s app/build/outputs/apk/debug/app-debug.apk
          printf 'Verified unit-test reports, lint report, and debug APK at this commit.\n'
